# --- General & Quality of Life ---
# Enable mouse support (scrolling, clicking panes, resizing)
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Remove delay when pressing Escape (crucial for Vim/Neovim)
set -sg escape-time 10

# Enable 256-color and true-color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Keybindings ---
# Optional: Change prefix from Ctrl-b to Ctrl-a
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload config file with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and - (and open in the current directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes using Alt + Arrow keys without needing the prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use Vi keys in copy mode (Prefix + [)
setw -g mode-keys vi

