[var]
# System Apps
SystemApps_Terminal = "alacritty"
SystemApps_FileManager = "$SystemApps_Terminal -e spf"
SystemApps_SystemMonitor = "$SystemApps_Terminal -e btop"
SystemApps_SystemInformation = "$SystemApps_Terminal -e bash -ic 'sleep 0.1; fetch'"

# User Apps
UserApps_TextEditor = "$SystemApps_Terminal -e vim"
UserApps_IDE = "$SystemApps_Terminal -e nvim"
UserApps_Browser = "librewolf"
UserApps_TorBrowser = "torbrowser-launcher"
UserApps_BrowserPrivate = "$UserApps_Browser --private-window"

# Quickshell
Menu = "quickshell msg launcher toggle"
Help = "quickshell msg keybinds toggle"

# Paths
Paths_Projects = "$HOME/Projects"
Paths_Dotfiles = "$HOME/.dotfiles"
Paths_Projects_Ironbook = "$Paths_Projects/programming/ironbook"

# Games
UserApps_Games_Heroic = "heroic"
UserApps_Games_Roblox = "flatpak run org.vinegarhq.Sober"
UserApps_Games_CombatMaster = "steam steam://rungameid/2281730"
UserApps_Games_Factorio = "xdg-open heroic://launch?appName=fLaV5gBTDzQeEu56JAvHKJ&runner=sideload"

# Browser Apps: AI
UserApps_BrowserApps_AI_Gemini = "https://gemini.google.com"
UserApps_BrowserApps_AI_ChatGPT = "https://chatgpt.com"

# Browser Apps: Entertainment
UserApps_BrowserApps_Entertainment_YouTube = "https://youtube.com"
UserApps_BrowserApps_Entertainment_YouTubeMusic = "https://music.youtube.com"

# Browser Apps: Chat
UserApps_BrowserApps_Chat_WhatsApp = "https://web.whatsapp.com"
UserApps_BrowserApps_Chat_Gmail = "https://gmail.com"
UserApps_BrowserApps_Chat_Discord = "https://discord.com/channels/@me"

# Browser Apps: Social Media
UserApps_BrowserApps_SocialMedia_Reddit = "https://reddit.com"

# Browser Apps: Games
UserApps_BrowserApps_Games_Roblox = "https://roblox.com"
UserApps_BrowserApps_Games_Chess = "https://chess.com"

# Browser Apps: Programming
UserApps_BrowserApps_Programming_GitHub = "https://github.com"

# Browser Apps: Github
UserApps_BrowserApps_Programming_GitHub_Me = "$UserApps_BrowserApps_Programming_GitHub/Abled-Taha"
