[global]

source = ["./modules/vars.toml", "./modules/binds.toml", "./modules/monitors.toml", "./modules/env.toml", "./modules/tags.toml", "./modules/windows.toml"]
exec_once = ["quickshell &", "kmonad $HOME/.dotfiles/keyboard.kbd &", "wl-clip-persist --clipboard regular --reconnect-tries 0 &", "wl-paste text --watch cliphist store &"]

# Decorations
blur = 0
shadows = 0
border_radius = 0
focused_opacity = 1.0
unfocused_opacity = 0.5
animations = 0

# Master-Stack Layout Setting
new_is_master = 0
default_master_factor = 0.55
default_master_count = 1

# Misc
disable_middle_paste = 1
cursor_size = 24

# keyboard
repeat_rate = 50
repeat_delay = 250
numlock_on = 1
xkb_rules_layout = "us,pk"
xkb_rules_options = "compose:sclk"

# Appearance
gap_inner_horizontal = 1
gap_inner_vertical = 1
gap_outer_horizontal = 0
gap_outer_vertical = 0
border_px = 1
root_color = 0x201b14ff
border_color = 0x444444ff
drop_color = 0x8FBA7C55
split_color = 0xEB441EFF
focus_color = 0xc9b890ff
maximized_screen_color = 0x89aa61ff
urgent_color = 0xad401fff
scratchpad_color = 0x516c93ff
global_color = 0xb153a7ff
overlay_color = 0x14a57cff
